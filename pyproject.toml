[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ai-benchmark"
version = "0.1.0"
description = "A reproducible frozen medical benchmark dataset builder"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["src*"]
